<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Pasko Photo Magic</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:wght@700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{max-width:1000px;margin:0 auto;padding:0 4% 60px}
  .admin-head{display:flex;justify-content:space-between;align-items:center;padding:25px 0}
  .tabs{display:flex;gap:8px;margin:15px 0 25px;flex-wrap:wrap}
  .tabs button{padding:10px 20px;border-radius:25px;border:1px solid #e6e8df;background:#fff;font-weight:800;cursor:pointer;color:var(--green)}
  .tabs button.active{background:var(--red);color:#fff;border-color:var(--red)}
  .tab-pane{display:none}.tab-pane.active{display:block}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:25px}
  .stat{background:#fff;border:1px solid #e6e8df;border-radius:15px;padding:18px;text-align:center}
  .stat b{display:block;font-size:26px;color:var(--green-dark);font-family:var(--serif)}
  .stat small{color:var(--muted);font-size:11px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:12px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #edf0eb}
  th{background:var(--green);color:#fff;font-size:11px}
  .badge{padding:4px 10px;border-radius:15px;font-size:10px;font-weight:800;color:#fff}
  .st-pending{background:#b8860b}.st-paid{background:#1e6fd9}.st-generating{background:#7048b6}
  .st-done{background:var(--green)}.st-failed,.st-refunded{background:var(--red)}
  .admin-card{background:rgba(255,253,248,.96);border:1px solid #e6e8df;border-radius:20px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
  .admin-card h3{margin:0 0 14px;font-family:var(--serif);color:var(--green-dark)}
  .tpl-admin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;font:inherit;margin:5px 0;box-sizing:border-box}
  .login-box{max-width:400px;margin:12vh auto}
  @media(max-width:620px){.stat-grid{grid-template-columns:1fr 1fr}.tpl-admin{grid-template-columns:1fr}table{font-size:11px}}
</style>
</head>
<body>
<div class="admin-head">
  <a class="brand" href="index.html"><span class="brand-script">Pasko</span><span>Photo Magic</span></a>
  <a class="btn btn-red btn-small" href="index.html">← View site</a>
</div>

<!-- LOGIN -->
<div class="login-box" id="loginView">
  <div class="admin-card">
    <h3>✦ Admin Login</h3>
    <input class="field" type="password" id="adminToken" placeholder="Admin token">
    <button class="btn btn-red full" id="loginBtn">Login →</button>
    <p class="plan-detail" id="loginMsg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashView" style="display:none">
  <div class="tabs">
    <button class="active" data-tab="settings">⚙️ Settings</button>
    <button data-tab="templates">🎄 Templates</button>
    <button data-tab="orders">🧾 Orders</button>
    <button id="logoutBtn" style="margin-left:auto">Logout</button>
  </div>

  <!-- SETTINGS -->
  <div class="tab-pane active" id="tab-settings">
    <div class="admin-card">
      <h3>Page content</h3>
      <label>Site title</label><input class="field" id="set_site_title">
      <label>Pricing eyebrow</label><input class="field" id="set_pricing_eyebrow">
      <label>Pricing heading</label><input class="field" id="set_pricing_title">
    </div>
    <div class="admin-card">
      <h3>Packages &amp; payment</h3>
      <label>₱99 — Name</label><input class="field" id="set_price_99_name">
      <label>₱99 — Detail</label><input class="field" id="set_price_99_detail">
      <label>₱149 — Name</label><input class="field" id="set_price_149_name">
      <label>₱149 — Detail</label><input class="field" id="set_price_149_detail">
      <label>GCash number</label><input class="field" id="set_payment_gcash">
      <label>Maya number</label><input class="field" id="set_payment_maya">
      <button class="btn btn-green" id="saveSettings">💾 Save settings</button>
      <span class="plan-detail" id="saveMsg"></span>
    </div>
  </div>

  <!-- TEMPLATES -->
  <div class="tab-pane" id="tab-templates">
    <div class="admin-card">
      <h3>➕ Add template</h3>
      <input class="field" id="tpl_name" placeholder="Name (e.g. Binibining Gabi)">
      <input class="field" id="tpl_emoji" placeholder="Emoji (e.g. ❤️)">
      <input class="field" id="tpl_tagline" placeholder="Tagline">
      <input class="field" id="tpl_prompt" placeholder="AI prompt">
      <button class="btn btn-green" id="addTpl">Add →</button>
    </div>
    <div id="tplList"></div>
  </div>

  <!-- ORDERS -->
  <div class="tab-pane" id="tab-orders">
    <div class="stat-grid">
      <div class="stat"><b id="stTotal">–</b><small>Total orders</small></div>
      <div class="stat"><b id="stRevenue">–</b><small>Revenue (paid)</small></div>
      <div class="stat"><b id="stPending">–</b><small>Pending payment</small></div>
      <div class="stat"><b id="stDone">–</b><small>Completed</small></div>
    </div>
    <table>
      <thead><tr><th>Customer</th><th>Template</th><th>Package</th><th>Pay</th><th>Ref</th><th>Status</th><th></th></tr></thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>
</div>
<script type="module" src="admin.js"></script>
</body>
</html>
