<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin CMS — Pasko Photo Magic</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --green: #075b3d; --red: #c91420; --bg: #f0f4f1; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Login Screen */
    #loginScreen { background: white; padding: 40px; border-radius: 12px; max-width: 400px; margin: 50px auto; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    #loginScreen input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    
    /* Dashboard */
    #dashboard { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: white; color: var(--green); }
    .tab-btn.active { background: var(--green); color: white; }
    
    /* Order Cards */
    .order-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 20px; align-items: flex-start; }
    .order-image { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .order-details { flex: 1; }
    .order-details p { margin: 5px 0; font-size: 14px; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-approved { background: #d1ecf1; color: #0c5460; }
    .status-completed { background: #d4edda; color: #155724; }
    
    /* Action Buttons */
    .actions { display: flex; flex-direction: column; gap: 8px; }
    .btn { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; text-align: center; }
    .btn-approve { background: #0dcaf0; }
    .btn-complete { background: #198754; }
    .btn-reject { background: #dc3545; }
    .btn:hover { opacity: 0.8; }
  </style>
</head>
<body>

<div class="container">
  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <h2>Admin Login</h2>
    <input type="password" id="adminKeyInput" placeholder="Enter Admin Key">
    <button class="btn btn-approve" style="width: 100%;" onclick="login()">Login</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="header">
      <h2 style="color: var(--green); margin: 0;">Admin Dashboard</h2>
      <button class="btn btn-reject" onclick="logout()">Logout</button>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" onclick="loadOrders('pending', this)">Pending</button>
      <button class="tab-btn" onclick="loadOrders('approved', this)">Approved (Rendering)</button>
      <button class="tab-btn" onclick="loadOrders('completed', this)">Completed</button>
    </div>

    <div id="ordersList"></div>
  </div>
</div>

<!-- Load Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
